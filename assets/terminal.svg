<svg xmlns="http://www.w3.org/2000/svg" width="780" height="472" viewBox="0 0 780 472" xml:space="preserve">
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <rect x="8" y="8" width="764" height="450" rx="12" fill="#16161e" stroke="#2a2e42" stroke-width="1"/>
    <rect x="8" y="8" width="764" height="36" rx="12" fill="#1a1b26"/>
    <rect x="8" y="26" width="764" height="18" fill="#1a1b26"/>
    <rect x="9" y="43" width="762" height="1" fill="#2a2e42"/>
    <circle cx="30" cy="26" r="6" fill="#ff5f56"/>
    <circle cx="50" cy="26" r="6" fill="#ffbd2e"/>
    <circle cx="70" cy="26" r="6" fill="#27c93f"/>
    <text x="390" y="30" text-anchor="middle" font-family="Consolas, Menlo, 'Courier New', monospace" font-size="12" fill="#565f89">yyf@l3yf: ~  ·  bash — 80×24</text>
  </g>
  <g font-family="Consolas, Menlo, 'Courier New', monospace" font-size="14" xml:space="preserve">
    <text x="32" y="74" fill="#565f89">Last login: never (bot never sleeps)</text>
    <text x="32" y="96"><tspan fill="#5af78e">yyf@l3yf</tspan><tspan fill="#565f89">:</tspan><tspan fill="#57c7ff">~</tspan><tspan fill="#e2e2e3">$ whoami</tspan></text>
    <text x="32" y="118" fill="#a9b1d6">systems programming · binary re · web3 infra</text>
    <text x="32" y="140"><tspan fill="#5af78e">yyf@l3yf</tspan><tspan fill="#565f89">:</tspan><tspan fill="#57c7ff">~</tspan><tspan fill="#e2e2e3">$ cast block latest --field number</tspan></text>
    <text x="32" y="162"><tspan fill="#a9b1d6">21467382 </tspan><tspan fill="#57c7ff">(0x1470AF6)</tspan></text>
    <text x="32" y="184"><tspan fill="#5af78e">yyf@l3yf</tspan><tspan fill="#565f89">:</tspan><tspan fill="#57c7ff">~</tspan><tspan fill="#e2e2e3">$ uptime</tspan></text>
    <text x="32" y="206" fill="#a9b1d6">up 1337 days · load 0.42 0.69 0.42 · 3 bots alive</text>
    <text x="32" y="228"><tspan fill="#5af78e">yyf@l3yf</tspan><tspan fill="#565f89">:</tspan><tspan fill="#57c7ff">~</tspan><tspan fill="#e2e2e3">$ ps aux | grep yyf</tspan></text>
    <text x="32" y="250" fill="#a9b1d6">indexer.pid   --subscribe --backfill<tspan x="460" fill="#5af78e">[ok]</tspan></text>
    <text x="32" y="272" fill="#a9b1d6">arb-bot.pid   --private-rpc --no-fork<tspan x="460" fill="#5af78e">[ok]</tspan></text>
    <text x="32" y="294" fill="#a9b1d6">node-sync.pid --archive --ws        <tspan x="460" fill="#5af78e">[ok]</tspan></text>
    <text x="32" y="316"><tspan fill="#5af78e">yyf@l3yf</tspan><tspan fill="#565f89">:</tspan><tspan fill="#57c7ff">~</tspan><tspan fill="#e2e2e3">$ tail -4 mempool.log</tspan></text>
    <text x="32" y="338"><tspan fill="#5af78e">[ok]</tspan><tspan x="84" fill="#a9b1d6">tx </tspan><tspan fill="#57c7ff">0x7a3f…9c21</tspan><tspan fill="#a9b1d6"> landed · block+1</tspan></text>
    <text x="32" y="360"><tspan fill="#5af78e">[ok]</tspan><tspan x="84" fill="#a9b1d6">eip-712 sig verified · nonce </tspan><tspan fill="#57c7ff">0x2b</tspan></text>
    <text x="32" y="382"><tspan fill="#ffbd2e">[warn]</tspan><tspan x="84" fill="#a9b1d6">rival gas +2% → rebid</tspan></text>
    <text x="32" y="404"><tspan fill="#57c7ff">[info]</tspan><tspan x="84" fill="#a9b1d6">exit refused: mempool never sleeps</tspan></text>
    <text x="32" y="426"><tspan fill="#5af78e">yyf@l3yf</tspan><tspan fill="#565f89">:</tspan><tspan fill="#57c7ff">~</tspan><tspan fill="#e2e2e3">$</tspan></text>
  </g>
  <rect x="127" y="413" width="9" height="17" fill="#e2e2e3">
    <animate attributeName="opacity" values="1;0" dur="1.1s" calcMode="discrete" repeatCount="indefinite"/>
  </rect>
